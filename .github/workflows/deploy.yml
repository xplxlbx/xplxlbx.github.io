name: Deploy Static Site to Pages

# 1. 触发条件：每当往 main 或 master 分支 push 代码时自动触发
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: # 允许在网页端手动点击按钮触发

# 2. 授予 Action 写入 Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 3. 定义执行的任务 (Jobs)
jobs:
  build_and_deploy:
    Environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest # 使用 GitHub 提供的最新 Ubuntu 云端虚拟机
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 步骤 A：拉取你的仓库代码

      - name: Generate build info (练习测试：自动注入构建时间)
        run: |
          echo "<!-- Built at $(date -u) -->" >> index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # 步骤 B：打包当前目录作为网页产物
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # 步骤 C：正式部署到 xplxlbx.github.io
