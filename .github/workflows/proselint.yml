name: Markdown Prose Lint
on: [push]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Proselint
        run: sudo apt-get update && sudo apt-get install proselint -y
      - name: Lint Markdown Files
        run: proselint *.md
