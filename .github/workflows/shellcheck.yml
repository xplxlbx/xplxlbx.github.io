name: ShellCheck CI/CD
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck *.sh

  deploy:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Deploy to Pages
        run: echo "🚨 CI 质检绿灯通过，正在向外网发布页面..."
